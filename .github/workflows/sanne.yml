name: MT5 Headless

on:
  workflow_dispatch:

jobs:

  # Find every saved.ini and group them into maximum 3 per runner.
  # This job does not need Windows, so use Ubuntu.
  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.find.outputs.matrix }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find Runners
        id: find
        shell: bash
        run: |

          set -e

          mapfile -t configs < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "saved.ini" \
              -print | sort
          )

          if [ "${#configs[@]}" -eq 0 ]; then
            echo "No saved.ini files found"
            exit 1
          fi

          echo "Found ${#configs[@]} saved.ini files"
          echo ""

          groups=()
          current=()

          for config in "${configs[@]}"; do

            # Repository-relative path.
            relative="${config#"$GITHUB_WORKSPACE"/}"

            # Normalize separators.
            relative="${relative//\\//}"

            directory="${config%/*}"
            servers="$directory/servers.dat"

            #
            # Every saved.ini folder must contain servers.dat.
            #
            if [ ! -f "$servers" ]; then
              echo ""
              echo "ERROR: servers.dat is missing"
              echo "Folder: $directory"
              echo "Expected: $servers"
              echo ""
              exit 1
            fi

            current+=("$relative")

            #
            # Maximum 3 MT5 terminals per GitHub runner.
            #
            if [ "${#current[@]}" -eq 3 ]; then

              group_json=$(
                printf '%s\n' "${current[@]}" |
                jq -R -s -c '
                  split("\n") |
                  map(select(length > 0))
                '
              )

              groups+=("$group_json")
              current=()

            fi

          done


          #
          # Add remaining configurations.
          #
          if [ "${#current[@]}" -gt 0 ]; then

            group_json=$(
              printf '%s\n' "${current[@]}" |
              jq -R -s -c '
                split("\n") |
                map(select(length > 0))
              '
            )

            groups+=("$group_json")

          fi


          echo "Creating ${#groups[@]} GitHub runner(s)"
          echo ""

          include="[]"

          number=1

          for group in "${groups[@]}"; do

            echo "Runner ${number}:"

            while IFS= read -r ini; do

              folder="${ini%/*}"

              echo "  Folder  : $folder"
              echo "  INI     : $ini"
              echo "  Servers : $folder/servers.dat"

            done < <(
              echo "$group" | jq -r '.[]'
            )

            echo ""

            include=$(
              jq -c \
                --argjson configs "$group" \
                '. + [{"configs": $configs}]' \
                <<< "$include"
            )

            number=$((number + 1))

          done


          #
          # Build the GitHub Actions matrix.
          #
          matrix=$(
            jq -c \
              --argjson include "$include" \
              '{"include": $include}' \
              <<< '{}'
          )

          echo "Matrix:"
          echo "$matrix"
          echo ""

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"


  mt5:
    needs: prepare

    runs-on: windows-latest

    strategy:
      fail-fast: false

      #
      # Different matrix entries run on different GitHub runners.
      # Therefore MT5 installations happen concurrently.
      #
      max-parallel: 10

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Download
        shell: cmd
        run: |

          curl -fL "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -o mt5setup.exe

          if not exist mt5setup.exe exit /b 1

          for %%A in (mt5setup.exe) do if %%~zA==0 exit /b 1

          echo Downloaded mt5setup.exe


      - name: Install
        shell: cmd
        run: |

          mt5setup.exe /auto /path:"C:\MT5"

          echo Installer exit code: %ERRORLEVEL%

          echo Checking C:\MT5...

          if exist "C:\MT5\terminal64.exe" (

            echo MT5 installed successfully
            dir "C:\MT5"

          ) else (

            echo MT5 was NOT installed
            dir "C:\MT5" 2>nul
            exit /b 1

          )


      - name: Prepare Terminals
        shell: powershell
        run: |

          $source = "C:\MT5"

          if (!(Test-Path "$source\terminal64.exe")) {
            Write-Host "terminal64.exe was not found"
            exit 1
          }

          $configs = '${{ toJSON(matrix.configs) }}' | ConvertFrom-Json

          Write-Host ""
          Write-Host "========================================"
          Write-Host "This GitHub runner has $($configs.Count) MT5 configuration(s)"
          Write-Host "Maximum allowed: 3"
          Write-Host "========================================"
          Write-Host ""

          $index = 1

          foreach ($relativeIni in $configs) {

            #
            # Reconstruct repository path on this Windows runner.
            #
            $ini = Join-Path `
              $env:GITHUB_WORKSPACE `
              ($relativeIni -replace '/', '\')

            $directoryToIni = Split-Path $ini -Parent

            $servers = Join-Path `
              $directoryToIni `
              "servers.dat"


            #
            # Validate saved.ini.
            #
            if (!(Test-Path $ini)) {

              Write-Host "ERROR: saved.ini not found"
              Write-Host "Path: $ini"

              exit 1
            }


            #
            # Validate servers.dat.
            #
            if (!(Test-Path $servers)) {

              Write-Host "ERROR: servers.dat not found"
              Write-Host "Path: $servers"

              exit 1
            }


            #
            # Every MT5 terminal gets its own isolated directory.
            #
            $terminalDir = "C:\MT5-Runners\MT5-$index"

            Write-Host "========================================"
            Write-Host "Preparing MT5-$index"
            Write-Host "Repository : $directoryToIni"
            Write-Host "INI        : $ini"
            Write-Host "Servers    : $servers"
            Write-Host "Terminal   : $terminalDir"
            Write-Host "========================================"


            #
            # Remove old directory if present.
            #
            if (Test-Path $terminalDir) {

              Remove-Item `
                $terminalDir `
                -Recurse `
                -Force

            }


            #
            # Create isolated terminal directory.
            #
            New-Item `
              -ItemType Directory `
              -Path $terminalDir `
              -Force |
              Out-Null


            #
            # Copy MT5 installation.
            #
            Copy-Item `
              -Path "$source\*" `
              -Destination $terminalDir `
              -Recurse `
              -Force


            #
            # Create MT5 config directory.
            #
            $configDir = Join-Path `
              $terminalDir `
              "config"

            New-Item `
              -ItemType Directory `
              -Path $configDir `
              -Force |
              Out-Null


            #
            # Copy THIS folder's servers.dat.
            #
            Copy-Item `
              -Path $servers `
              -Destination (
                Join-Path $configDir "servers.dat"
              ) `
              -Force


            #
            # Copy THIS folder's saved.ini.
            #
            Copy-Item `
              -Path $ini `
              -Destination (
                Join-Path $terminalDir "saved.ini"
              ) `
              -Force


            #
            # Verify everything.
            #
            Write-Host ""
            Write-Host "Prepared MT5-${index}:"
            Write-Host "  $terminalDir\terminal64.exe"
            Write-Host "  $terminalDir\saved.ini"
            Write-Host "  $terminalDir\config\servers.dat"
            Write-Host ""


            if (!(Test-Path "$terminalDir\terminal64.exe")) {

              Write-Host "ERROR: terminal64.exe was not copied"
              exit 1

            }


            if (!(Test-Path "$terminalDir\saved.ini")) {

              Write-Host "ERROR: saved.ini was not copied"
              exit 1

            }


            if (!(Test-Path "$terminalDir\config\servers.dat")) {

              Write-Host "ERROR: servers.dat was not copied"
              exit 1

            }


            $index++

          }


      - name: Run
        shell: powershell
        run: |

          $configs = '${{ toJSON(matrix.configs) }}' | ConvertFrom-Json

          $processes = @()

          #
          # Keep track of which byte position we have already
          # printed from every MT5 log file.
          #
          $positions = @{}

          $index = 1


          #
          # Start all MT5 terminals on this runner.
          #
          foreach ($relativeIni in $configs) {

            $terminalDir = "C:\MT5-Runners\MT5-$index"

            $exe = Join-Path `
              $terminalDir `
              "terminal64.exe"

            $configFile = Join-Path `
              $terminalDir `
              "saved.ini"

            $serversFile = Join-Path `
              $terminalDir `
              "config\servers.dat"


            Write-Host ""
            Write-Host "========================================"
            Write-Host "Starting MT5-$index"
            Write-Host "Repository : $relativeIni"
            Write-Host "Terminal   : $exe"
            Write-Host "INI        : $configFile"
            Write-Host "Servers    : $serversFile"
            Write-Host "========================================"


            if (!(Test-Path $exe)) {

              Write-Host "ERROR: terminal64.exe missing"
              exit 1

            }


            if (!(Test-Path $configFile)) {

              Write-Host "ERROR: saved.ini missing"
              exit 1

            }


            if (!(Test-Path $serversFile)) {

              Write-Host "ERROR: servers.dat missing"
              exit 1

            }


            #
            # Exact command:
            #
            # terminal64.exe /portable /config:"saved.ini"
            #
            Write-Host ""
            Write-Host "Command:"
            Write-Host "terminal64.exe /portable /config:`"$configFile`""
            Write-Host ""


            $process = Start-Process `
              -FilePath $exe `
              -ArgumentList "/portable /config:`"$configFile`"" `
              -WorkingDirectory $terminalDir `
              -PassThru


            $processes += $process


            Write-Host "[MT5-$index] Started PID: $($process.Id)"


            $index++

          }


          Write-Host ""
          Write-Host "========================================"
          Write-Host "All MT5 terminals started."
          Write-Host "========================================"
          Write-Host ""


          foreach ($process in $processes) {

            Write-Host "MT5 PID: $($process.Id)"

          }


          Write-Host ""
          Write-Host "========================================"
          Write-Host "LIVE MT5 OUTPUT"
          Write-Host "========================================"
          Write-Host ""


          #
          # Function that reads new data from MT5 log files.
          #
          function Read-MT5Logs {

            param(
              [int]$TerminalIndex
            )


            $terminalDir = "C:\MT5-Runners\MT5-$TerminalIndex"


            #
            # MT5 terminal Journal logs.
            #
            $logDirs = @(
              (Join-Path $terminalDir "Logs"),

              #
              # MQL5 Expert Advisor logs.
              #
              (Join-Path $terminalDir "MQL5\Logs")
            )


            foreach ($logDir in $logDirs) {

              if (!(Test-Path $logDir)) {
                continue
              }


              #
              # Find log files.
              #
              $files = @(
                Get-ChildItem `
                  -Path $logDir `
                  -Filter "*.log" `
                  -File `
                  -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime
              )


              foreach ($file in $files) {

                $key = $file.FullName


                #
                # Start at byte 0 for a new file.
                #
                if (!$positions.ContainsKey($key)) {

                  $positions[$key] = 0

                }


                try {

                  $length = $file.Length


                  #
                  # Log file was replaced/truncated.
                  #
                  if ($length -lt $positions[$key]) {

                    $positions[$key] = 0

                  }


                  #
                  # Only read newly written data.
                  #
                  if ($length -gt $positions[$key]) {


                    $stream = [System.IO.File]::Open(
                      $file.FullName,
                      [System.IO.FileMode]::Open,
                      [System.IO.FileAccess]::Read,
                      [System.IO.FileShare]::ReadWrite
                    )


                    try {

                      $stream.Seek(
                        $positions[$key],
                        [System.IO.SeekOrigin]::Begin
                      ) | Out-Null


                      $reader = New-Object `
                        System.IO.StreamReader(
                          $stream,
                          [System.Text.Encoding]::Default,
                          $true
                        )


                      while (
                        ($line = $reader.ReadLine()) -ne $null
                      ) {

                        if ($line.Trim().Length -gt 0) {

                          Write-Host "[MT5-$TerminalIndex] $line"

                        }

                      }


                      $reader.Dispose()

                    }
                    finally {

                      $stream.Dispose()

                    }


                    #
                    # Remember how far we read.
                    #
                    $positions[$key] = $length

                  }

                }
                catch {

                  #
                  # MT5 may temporarily have the log file locked.
                  # Try again during the next cycle.
                  #

                }

              }

            }

          }


          #
          # Main monitoring loop.
          #
          while ($true) {


            #
            # Read output from every MT5 instance.
            #
            for (
              $i = 1;
              $i -le $configs.Count;
              $i++
            ) {

              Read-MT5Logs `
                -TerminalIndex $i

            }


            #
            # Check whether any MT5 terminal is still running.
            #
            $running = @(
              $processes |
              Where-Object {
                -not $_.HasExited
              }
            )


            #
            # All terminals have exited.
            #
            if ($running.Count -eq 0) {

              #
              # Do one final log read so messages written immediately
              # before shutdown are captured.
              #
              for (
                $i = 1;
                $i -le $configs.Count;
                $i++
              ) {

                Read-MT5Logs `
                  -TerminalIndex $i

              }


              Write-Host ""
              Write-Host "========================================"
              Write-Host "All MT5 terminals have exited."
              Write-Host "========================================"

              break

            }


            #
            # Check logs frequently.
            #
            Start-Sleep -Milliseconds 500

          }
