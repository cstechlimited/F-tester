name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest

    steps:
      - name: Enable Windows RDP
        shell: cmd
        run: |
          echo Enabling Remote Desktop...

          reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" ^
            /v fDenyTSConnections /t REG_DWORD /d 0 /f

          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes

          sc config TermService start=auto
          net start TermService

          echo.
          echo ==============================
          echo RDP SERVER ENABLED
          echo ==============================
          echo.

      - name: Create RDP user
        shell: cmd
        run: |
          net user rdpuser "ChangeThisPassword123!" /add
          net localgroup "Remote Desktop Users" rdpuser /add

          echo.
          echo RDP USER:
          echo rdpuser
          echo.
          echo RDP PASSWORD:
          echo ChangeThisPassword123!
          echo.

      - name: Display connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP CONNECTION INFORMATION"
          Write-Host "========================================"

          $ip = (Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*" -and
              $_.IPAddress -notlike "169.254.*"
            } |
            Select-Object -First 1 -ExpandProperty IPAddress)

          Write-Host "IP Address : $ip"
          Write-Host "Port       : 3389"
          Write-Host "Username   : rdpuser"
          Write-Host "Password   : ChangeThisPassword123!"

          Write-Host "========================================"
          Write-Host ""
          Write-Host "Connect using:"
          Write-Host "mstsc /v:$ip"
