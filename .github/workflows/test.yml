name: Windows Screen Share

on:
  workflow_dispatch:

jobs:
  screen-share:
    name: Windows VNC Screen Share
    runs-on: windows-latest
    timeout-minutes: 31

    steps:
      - name: Install TightVNC
        shell: powershell
        run: |
          $url = "https://www.tightvnc.com/download/2.8.85/tightvnc-2.8.85-gpl-setup-64bit.msi"
          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -NoNewWindow

      - name: Configure VNC password
        shell: powershell
        run: |
          # VNC password is set to "sanne"
          $password = "sanne"

          New-Item -Path "HKLM:\SOFTWARE\TightVNC" -Force | Out-Null

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\TightVNC" `
            -Name "Password" `
            -PropertyType String `
            -Value $password `
            -Force | Out-Null

      - name: Start VNC server
        shell: powershell
        run: |
          $vnc = Get-ChildItem `
            "C:\Program Files\TightVNC" `
            -Filter "tvnserver.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $vnc) {
            Write-Error "TightVNC server was not found."
            exit 1
          }

          Start-Process $vnc.FullName

          Start-Sleep -Seconds 5

          Get-Process tvnserver -ErrorAction SilentlyContinue

      - name: Verify VNC port
        shell: powershell
        run: |
          $listening = Get-NetTCPConnection `
            -LocalPort 5900 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listening) {
            Write-Error "Nothing is listening on TCP port 5900."
            exit 1
          }

          Write-Host "VNC is listening on TCP port 5900."

      - name: Install ngrok
        shell: powershell
        run: |
          $ngrokZip = "$env:TEMP\ngrok.zip"
          $ngrokDir = "$env:RUNNER_TEMP\ngrok"

          New-Item -ItemType Directory -Force -Path $ngrokDir | Out-Null

          Invoke-WebRequest `
            -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" `
            -OutFile $ngrokZip

          Expand-Archive `
            -Path $ngrokZip `
            -DestinationPath $ngrokDir `
            -Force

          "$ngrokDir" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

      - name: Configure ngrok
        shell: powershell
        run: |
          # ⚠️ Replace YOUR_NGROK_AUTHTOKEN_HERE with your actual ngrok authtoken
          $ngrokToken = "3IiME5Z0qPJP5d3v0nBtpy7NaC0_4BnhtPb8vmQDDfznQhJJV"

          ngrok config add-authtoken "$ngrokToken"

      - name: Start ngrok tunnel
        shell: powershell
        run: |
          Start-Process `
            -FilePath "ngrok.exe" `
            -ArgumentList "tcp 5900 --log=stdout" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\ngrok.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\ngrok-error.log" `
            -WindowStyle Hidden

          Write-Host "Waiting for ngrok..."

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1

            try {
              $response = Invoke-RestMethod `
                -Uri "http://127.0.0.1:4040/api/tunnels" `
                -ErrorAction Stop

              if ($response.tunnels.Count -gt 0) {
                $ready = $true
                break
              }
            }
            catch {
              # ngrok API is not ready yet
            }
          }

          if (-not $ready) {
            Write-Host "ngrok log:"
            if (Test-Path "$env:RUNNER_TEMP\ngrok.log") {
              Get-Content "$env:RUNNER_TEMP\ngrok.log"
            }

            Write-Error "ngrok tunnel did not start."
            exit 1
          }

      - name: Show VNC connection address
        shell: powershell
        run: |
          $response = Invoke-RestMethod `
            -Uri "http://127.0.0.1:4040/api/tunnels"

          $tunnel = $response.tunnels |
            Where-Object { $_.proto -eq "tcp" } |
            Select-Object -First 1

          if (-not $tunnel) {
            Write-Error "No TCP ngrok tunnel found."
            exit 1
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       WINDOWS VNC CONNECTION"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Public address:"
          Write-Host $tunnel.public_url
          Write-Host ""
          Write-Host "Use the hostname and port shown above"
          Write-Host "in your VNC client."
          Write-Host "Password: sanne"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

      - name: Keep screen share alive
        shell: powershell
        run: |
          Write-Host "VNC screen share is running."
          Write-Host "The runner will remain available for 30 minutes."

          Start-Sleep -Seconds 1800
